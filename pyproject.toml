[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hlagent"
version = "2.0.0a1"
description = "Auditable, conversational HLA research workflows"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "streamlit>=1.45,<2",
  "pydantic>=2.11,<3", "pydantic-settings>=2.8,<3",
  "pydantic-ai-slim[google,anthropic,openai]>=2,<3",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=2,<4",
  "numpy>=2,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "statsmodels>=0.14,<1", "plotly>=6,<7", "matplotlib>=3.9,<4",
  "httpx>=0.28,<1", "cryptography>=44", "pypdf>=5,<7",
  "python-docx>=1.1,<2", "python-multipart>=0.0.20", "psutil>=6,<8",
  "filelock>=3.17,<4", "typer>=0.15,<1", "pysam>=0.23,<1",
  "faiss-cpu>=1.10,<2", "scikit-learn>=1.6,<2",
  "fastembed>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
hlagent = "hlagent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hlagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires installed bioinformatics executables", "live: requires explicit provider credentials"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
