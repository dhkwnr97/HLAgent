# IMGT2Seq Configuration File
# ===========================
# This file contains the configuration parameters for the IMGT2Seq function.
# Each parameter corresponds to a parameter in the IMGT2Seq function.

# Required parameters
_imgt: 3320
_hg: "18"                                                            # Human genome version of your input data(18, 19, 38)
_out_dir: "data/output/Imgt2Seq"                                     # Output directory

# Optional parameters
_imgt_dir: "src/tools/HATK/IMGT2Seq/data_for_imgt2seq/imgthla/IMGTHLA-3.32.0-alpha" # IMGT directory (if null, will be downloaded automatically)(original: src/tools/HATK/IMGT2Seq/data_for_imgt2seq/imgthla/IMGTHLA-3.60.0-alpha)
_no_Indel: false                                                     # Whether to exclude indels (default: false)
_MultiP: 6                                                           # Multiprocessing (1 = single process, >1 = parallel processing)
_f_save_intermediates: false                                         # Save intermediate files (default: false)
_no_prime: true                                                      # No prime option (default: true)
_p_data: "src/tools/HATK/IMGT2Seq/data_for_imgt2seq"                 # Path to exon, codon information data directory 
__Nfield_OUTPUT_FORMAT: 2                                            # Output format specification (default: 2)

# HLA target genes to process
_HLA_target: ["A", "B", "C", "DPA1", "DPB1", "DQA1", "DQB1", "DRB1"]

# Extended HLA target genes (uncomment to include additional genes)
# _HLA_target: ["A", "B", "C", "DPA1", "DPB1", "DQA1", "DQB1", "DRB1"]
