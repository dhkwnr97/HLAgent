# OmnibusTest Configuration File
# ==============================
# Performs likelihood ratio test between null and alternative models for HLA amino acid analysis.
# 
# User Configuration Instructions:
# - Set _pheno_name to your desired phenotype column name from the phenotype file
# - Set _condition to amino acid positions for conditional analysis (e.g., "AA_DRB1_96" or "AA_DRB1_96,AA_DRB1_13")
# - If no conditioning is needed, leave _condition as null

# ==================================================================================
# REQUIRED PARAMETERS
# ==================================================================================

# Input files (configured for the specified HATK analysis)
_fam_file: "data/output/BMarkerGenerator/bMGen_wtccc_filtered_58C_RA.hatk.300+300_imgt3320_2field.hg18.fam"  # PLINK .fam file
_aa_file: "data/output/Phasing/phased_analysis.aa"                                                               # Preprocessed phased beagle file (.aa)
_pheno_file: "data/examples/wtccc_filtered_58C_RA.hatk.300+300.phe"                                             # Phenotype file

# Output directory
_out: "data/output/OmnibusTest"                                                                                   # Output directory path

# ==================================================================================
# USER CONFIGURABLE ANALYSIS PARAMETERS
# ==================================================================================

# Phenotype specification (USER CONFIGURABLE)
_pheno_name: "RA"                                                                                                 # Column name in phenotype file (USER SETS THIS)

# Conditioning - Set amino acid positions as covariates (USER CONFIGURABLE)
# Examples:
#   _condition: null                    # No conditioning
#   _condition: "AA_DRB1_96"           # Single condition
#   _condition: "AA_DRB1_96,AA_DRB1_13" # Multiple conditions (comma-separated)
_condition: null                                                                                                  # USER SETS THIS - conditions to apply

# ==================================================================================
# ADVANCED OPTIONAL PARAMETERS
# ==================================================================================

# Alternative input - Use this if you have the phased beagle file instead of .aa file
_bgl_phased: null                                                                                                 # Phased beagle file (e.g., *.bgl.phased)

# Covariate data (optional)
_covar_file: null                                                                                                 # Covariate file path
_covar_name: null                                                                                                 # Column names to use from covariate file

# Conditional analysis (alternative method) - use either _condition OR _condition_list, not both
_condition_list: null                                                                                             # File containing list of conditions

# ==================================================================================
# ANALYSIS CONFIGURATION
# ==================================================================================

# Omnibus test settings
_analysis_settings:
  require_phasing: true                                                                                           # Phasing is required when using conditions
  phenotype_type: "Binary"                                                                                        # Currently only Binary traits are supported
  process_bgl_to_aa: true                                                                                         # Automatically process .bgl.phased to .aa if needed

# ==================================================================================
# EXECUTION SETTINGS
# ==================================================================================

# Performance settings
_performance:
  measure_time: true                                                                                              # Measure execution time
  show_progress: true                                                                                             # Show progress indicators

# Temporary file management
_save_intermediates: false                                                                                        # Keep intermediate files (e.g., .aa.log, .omnibus.log)

# ==================================================================================
# LOGGING CONFIGURATION
# ==================================================================================

# Output verbosity
_verbose: true                                                                                                    # Enable verbose output
_log_level: "INFO"                                                                                                # Log level: DEBUG, INFO, WARNING, ERROR

# ==================================================================================
# VALIDATION SETTINGS
# ==================================================================================

# Input validation
_validation:
  check_input_files: true                                                                                         # Validate input files exist
  check_phenotype_type: true                                                                                      # Verify phenotype is binary
  check_r_availability: true                                                                                      # Check if R/Rscript is available

# ==================================================================================
# OUTPUT FILE NAMING CONVENTION
# ==================================================================================
# The output files will be named using the following pattern:
#
# Without condition:
# {output_prefix}.omnibus
#
# With condition(s):
# {output_prefix}.{conditions}.omnibus
#
# Example outputs:
# - Without condition: "omnibus_RA.omnibus"
# - With single condition: "omnibus_RA.AA_DRB1_96.omnibus"
# - With multiple conditions: "omnibus_RA.AA_DRB1_96,AA_DRB1_13.omnibus"
#
# Log files:
# - Processing log: {output_file}.log
# - AA preprocessing log: {output_prefix}.aa.log
#
# The output file contains columns:
# - MarkerName: Amino acid position identifier
# - Chr: Chromosome
# - Pos: Position
# - log10_P: -log10(p-value)
# - Additional statistics from the omnibus test
