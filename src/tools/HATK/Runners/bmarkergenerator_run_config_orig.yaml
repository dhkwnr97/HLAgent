# bMarkerGenerator Configuration File
# ===================================
# This file contains the configuration parameters for the bMarkerGenerator function.
# 
# bMarkerGenerator generates a marker panel where the polymorphic variation of the HLA region 
# is applied using binary marker strategy. It creates 4 classes of markers:
# 1. HLA allele binary markers (ex. HLA_A*01:01)
# 2. Amino acid residue binary markers (ex. AA_A_9_30018537_exon2_F)
# 3. Intragenic(exonic/intronic) SNP binary markers (ex. SNPS_A_228_30018537_exon2_A)
# 4. Intergenic SNP variant markers (ex. rs9269186, rs41557221)

# ==================================================================================
# REQUIRED PARAMETERS
# ==================================================================================

# Input files
_chped: "data/output/NomenCleaner/wtccc_filtered_58C_RA.hatk.300+300_imgt3320_2field.chped" # chped file (from NomenCleaner)
_out: "data/output/BMarkerGenerator"  # Output directory path
_hg: "18"                             # Human genome build of your input data(18, 19, 38)

# HLA Dictionary files (from IMGT2Seq output)
# These correspond to --dict-AA and --dict-SNPS arguments in HATK.py
_dictionary_AA_seq: "data/output/Imgt2Seq/HLA_DICTIONARY_AA.hg18.imgt3320.txt"      # AA sequence dictionary (from IMGT2Seq)
_dictionary_AA_map: "data/output/Imgt2Seq/HLA_DICTIONARY_AA.hg18.imgt3320.map"      # AA map file (from IMGT2Seq)
_dictionary_SNPS_seq: "data/output/Imgt2Seq/HLA_DICTIONARY_SNPS.hg18.imgt3320.txt"  # SNPS sequence dictionary (from IMGT2Seq)
_dictionary_SNPS_map: "data/output/Imgt2Seq/HLA_DICTIONARY_SNPS.hg18.imgt3320.map"  # SNPS map file (from IMGT2Seq)

# ==================================================================================
# OPTIONAL PARAMETERS
# ==================================================================================

# Intergenic SNP variants (corresponds to --variants argument in HATK.py)
# Set to null if you want to generate only HLA region markers
_variants: "data/examples/wtccc_filtered_58C_RA.hatk.300+300.hg18.chr6.29-34mb" # Path to external SNP variants file (PLINK format)
# _variants: null                                                           # Uncomment this line to disable intergenic SNP markers

# Processing options
_f_save_intermediates: false                                                # Save intermediate files for debugging
_plink: "plink"                                                             # Path to PLINK executable

# ==================================================================================
# HLA TARGET GENES
# ==================================================================================

# HLA target genes to process
# Standard 8 major HLA genes (recommended for most analyses)
_HLA_target: ["A", "B", "C", "DPA1", "DPB1", "DQA1", "DQB1", "DRB1"]

# Extended HLA target genes (uncomment to include additional genes)
# _HLA_target: ["A", "B", "C", "DPA1", "DPB1", "DQA1", "DQB1", "DRB1"]

# ==================================================================================
# BINARY MARKER SETTINGS
# ==================================================================================

# Configure which types of binary markers to generate
_binary_marker_settings:
  include_hla_alleles: true                                                 # Generate HLA allele binary markers (ex. HLA_A*01:01)
  include_aa_residues: true                                                 # Generate amino acid residue binary markers (ex. AA_A_9_30018537_exon2_F)
  include_intragenic_snps: true                                             # Generate intragenic SNP binary markers (ex. SNPS_A_228_30018537_exon2_A)
  include_intergenic_snps: true                                             # Generate intergenic SNP variant markers (ex. rs9269186, rs41557221)

# ==================================================================================
# PROCESSING STAGES
# ==================================================================================

# Configure which processing stages to execute
_stages:
  enable_qc_filtering: true                                                 # Apply quality control filtering
  enable_founder_extraction: true                                          # Extract founder individuals
  enable_merging: true                                                      # Merge different marker types

# ==================================================================================
# QUALITY CONTROL PARAMETERS
# ==================================================================================

# Configure QC thresholds for filtering
_qc_parameters:
  mind: 0.3                                                                 # Individual missing genotype threshold
  geno: 0.5                                                                 # SNP missing genotype threshold
  maf_threshold: 0.0001                                                     # Minor allele frequency threshold
  hwe_threshold: 0.000001                                                   # Hardy-Weinberg equilibrium p-value threshold

# ==================================================================================
# VALIDATION AND PERFORMANCE
# ==================================================================================

# Basic validation options (only the ones actually used in code)
_validation:
  check_input_files: true                                                   # Validate input files before processing
  check_dictionary_files: true                                             # Validate dictionary files before processing
  check_plink_availability: true                                           # Check if PLINK is available
  check_hla_compatibility: true                                            # Verify CHPED and config HLA gene compatibility
  check_marker_compatibility: true                                         # Verify marker type compatibility

# Basic performance options (only the ones actually used in code)
_performance:
  show_progress: true                                                       # Show progress during processing
  measure_time: true                                                        # Measure and report execution time
  show_stage_timing: true                                                   # Show timing for each processing stage

# Basic logging (only the ones actually used in code)
_logging:
  log_level: "INFO"                                                         # Logging level (DEBUG, INFO, WARNING, ERROR)
  _create_output_dir: true                                                  # Create output directory if it doesn't exist
  _verbose: true                                                            # Enable verbose logging
  _save_summary: true                                                       # Save processing summary to file

# Basic output settings (only the ones actually used in code)
_resources:
  temp_dir: "data/temp"                                                     # Temporary directory for intermediate files
  cleanup_temp: true                                                        # Clean up temporary files after completion