# Manhattan Plot Configuration File
# ==================================
# Configuration for generating Manhattan plots from HATK analysis results.

# ==================================================================================
# REQUIRED PARAMETERS
# ==================================================================================

# Input file and directories
_input_file: "data/output/BMarkerRegression/wtccc_filtered_58C_RA.hatk.300+300_REG_bMGen_wtccc_filtered_58C_RA.hatk.300+300_imgt3320_2field.hg18.assoc.logistic" # Association or Omnibus results file('.assoc.logistic', '.assoc.linear', '.omnibus')
_output_dir: "data/output/BMarkerRegression"                                             # Output directory for plot files

# Analysis configuration
_analysis_type: "regression"                                                          # Analysis type ('regression' or 'omnibus')

# ==================================================================================
# OPTIONAL PARAMETERS
# ==================================================================================

# Visualization settings
_visualization:
  output_formats: ["html", "png"]                                                 # Output formats ('html', 'png', 'pdf', 'svg')
  title: null                                                                     # Custom plot title (null for default)
  hla_region_focus: true                                                          # Focus on HLA region (chr6:29-34Mb)

# ==================================================================================
# LOGGING CONFIGURATION
# ==================================================================================

_logging:
  verbose: false                                                                     # Enable verbose output
  log_level: "INFO"                                                                 # Log level: DEBUG, INFO, WARNING, ERROR
  log_file: null                                                                    # Log file path (null = console only)
  show_progress: true                                                               # Show progress indicators