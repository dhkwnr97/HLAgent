# Meta-Analysis Visualization Configuration File
# =============================================
# Configuration for generating meta-analysis plots using metaanalPlot.py

# ==================================================================================
# REQUIRED PARAMETERS
# ==================================================================================

_meta_file: "data/output/MetaAnalysis/RA_vs_CD_MetaAnalysis.meta"   # Path to meta-analysis result file (.meta)
_output_prefix: "data/output/MetaAnalysis/RA_vs_CD_plots"           # Prefix for output plot files

# ==================================================================================
# OPTIONAL PARAMETERS
# ==================================================================================

# Plot types to generate (choose any subset)
_plot_types: ["qq", "manhattan", "effect_dist", "study_comp", "forest", "funnel"]

# Study result files for comparison/forest plots
_s1_logistic_result: "data/output/BMarkerRegression/wtccc_filtered_58C_RA.hatk.300+300_REG_bMGen_wtccc_filtered_58C_RA.hatk.300+300_imgt3320_2field.hg18.assoc.logistic" # Study 1 logistic result file
_s2_logistic_result: "data/examples/MetaAnalysis/RESULT_EXAMPLE_wtccc_filtered_NBS_CD.hatk.300+300.chr6.hg18.assoc.logistic" # Study 2 logistic result file

# Forest plot settings
_top_n_forest: 10   # Number of top SNPs for forest plot

# ==================================================================================
# LOGGING CONFIGURATION
# ==================================================================================

_logging:
  verbose: true
  log_level: "INFO"
  log_file: null
  show_progress: true

# ==================================================================================
# ADVANCED OPTIONS
# ==================================================================================

_error_handling:
  strict_validation: false

# ==================================================================================
# EXAMPLE USAGE
# ==================================================================================
#
# To run this configuration:
# python src/tools/HATK/Runners/run_metaanalPlot.py src/tools/HATK/Runners/metaanalPlot_run_config.yaml
#
# To generate only Q-Q and Manhattan plots:
#   _plot_types: ["qq", "manhattan"]
#
# To use only one study for Manhattan plot:
#   _s1_logistic_result: "path/to/study1.assoc.logistic"
# ================================================================================== 