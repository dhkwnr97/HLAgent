# Meta-Analysis Configuration File
# ================================
# Inverse-variance weighted meta-analysis for HLA association test results.

# ==================================================================================
# REQUIRED PARAMETERS
# ==================================================================================

# Study 1 Files
_s1_logistic_result: "data/output/BMarkerRegression/wtccc_filtered_58C_RA.hatk.300+300_REG_bMGen_wtccc_filtered_58C_RA.hatk.300+300_imgt3320_2field.hg18.assoc.logistic" # Study 1 logistic regression results
_s1_bim: "data/output/BMarkerGenerator/bMGen_wtccc_filtered_58C_RA.hatk.300+300_imgt3320_2field.hg18.bim" # Study 1 marker information (optional but recommended for allele flipping)

# Study 2 Files  
_s2_logistic_result: "data/examples/MetaAnalysis/RESULT_EXAMPLE_wtccc_filtered_NBS_CD.hatk.300+300.chr6.hg18.assoc.logistic" # Study 2 logistic regression results
_s2_bim: "data/examples/MetaAnalysis/RESULT_EXAMPLE_wtccc_filtered_NBS_CD.hatk.300+300.chr6.hg18.bim" # Study 2 marker information (optional but recommended for allele flipping)

# Output Settings
_out: "data/output/MetaAnalysis"                                                   # Output directory path
_output_name: "RA_vs_CD_MetaAnalysis"                                              # Output file name (without extension)

# ==================================================================================
# OPTIONAL PARAMETERS
# ==================================================================================

# Analysis Configuration
_analysis_settings:
  use_allele_flipping: true                                                         # Apply allele flipping between studies (requires BIM files)
  significance_threshold: 0.05                                                      # P-value threshold for significance
  genome_wide_threshold: 5e-8                                                       # Genome-wide significance threshold

# Quality Control Parameters
_quality_control:
  min_studies_per_variant: 2                                                        # Minimum number of studies a variant must appear in
  exclude_missing_alleles: true                                                     # Exclude variants with missing allele information
  check_allele_consistency: true                                                    # Check allele consistency between studies

# ==================================================================================
# PERFORMANCE SETTINGS
# ==================================================================================

# Memory and Performance
_performance:
  measure_time: true                                                                # Measure execution time
  show_progress: true                                                               # Show progress indicators
  chunk_size: 10000                                                                 # Number of variants to process at once

# ==================================================================================
# LOGGING CONFIGURATION
# ==================================================================================

# Output Verbosity
_verbose: true                                                                      # Enable verbose output
_log_level: "INFO"                                                                  # Log level: DEBUG, INFO, WARNING, ERROR

# Report Settings
_report:
  show_top_hits: true                                                               # Show top associations in console
  n_top_hits: 10                                                                    # Number of top hits to show
  save_summary: true                                                                # Save summary statistics file
  save_plots: false                                                                 # Generate plots (Manhattan, QQ) - not implemented yet

# ==================================================================================
# VALIDATION SETTINGS
# ==================================================================================

# Input Validation
_validation:
  check_input_files: true                                                           # Validate input files exist
  validate_file_format: true                                                        # Check file format validity
  check_common_variants: true                                                       # Ensure sufficient overlap between studies

# ==================================================================================
# ADVANCED SETTINGS
# ==================================================================================

# Statistical Methods
_statistical_settings:
  method: "inverse_variance"                                                        # Meta-analysis method (only inverse_variance supported)
  use_random_effects: false                                                         # Use random effects model (not implemented)
  heterogeneity_test: false                                                         # Perform heterogeneity test (not implemented)

# Filtering Options
_filtering:
  min_maf: null                                                                     # Minimum minor allele frequency filter
  max_pvalue: null                                                                  # Maximum p-value filter
  exclude_snps: null                                                                # File with SNPs to exclude

# ==================================================================================
# OUTPUT FILE NAMING CONVENTION
# ==================================================================================
# The output files will be named using the following pattern:
# {_output_name}.meta                 - Main meta-analysis results
# {_output_name}_summary.txt          - Summary statistics
# {_output_name}.log                  - Log file (if logging enabled)
#
# Example with current settings:
# Output files:
# - Meta-analysis results: "RA_vs_CD_MetaAnalysis.meta"
# - Summary file: "RA_vs_CD_MetaAnalysis_summary.txt"
#
# The .meta file contains columns:
# - SNP: Variant identifier
# - BETA: Combined effect size (inverse-variance weighted)
# - SE: Combined standard error
# - MetaP: Meta-analysis p-value
#
# This naming convention provides:
# - Clear identification of analysis type
# - User-customizable output names
# - Consistent file organization
# - Easy tracking of multiple analyses
# ==================================================================================