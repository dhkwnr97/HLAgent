# bMarkerRegression Configuration File
# ================================
# Intelligent regression analysis for HLA fine-mapping with automatic regression type selection.

# ==================================================================================
# REQUIRED PARAMETERS
# ==================================================================================

# Input files
_bfile_prefix: "data/output/BMarkerGenerator/bMGen_wtccc_filtered_58C_RA.hatk.300+300_imgt3320_2field.hg18"  # PLINK binary files prefix
_output_dir: "data/output/BMarkerRegression"  # Output directory path

# ==================================================================================
# OPTIONAL PARAMETERS
# ==================================================================================

# Phenotype data
_pheno_file: "data/examples/wtccc_filtered_58C_RA.hatk.300+300.phe"                # External phenotype file (if not using .fam phenotypes)
_pheno_name: "RA"                                                                   # Phenotype column name in phenotype file

# Covariate data
_covar_file: null                                                                   # Covariate file path
_covar_names: []                                                                    # List of covariate names to include

# Conditional analysis
_condition_list: null                                                               # File containing SNPs for conditional analysis

# ==================================================================================
# REGION PARAMETERS (HLA region defaults)
# ==================================================================================

_chr: 6                                                                             # Chromosome number (default: 6 for HLA)
_from_mb: 29                                                                        # Start position in megabases
_to_mb: 34                                                                          # End position in megabases
_ci: 0.95                                                                           # Confidence interval

# ==================================================================================
# ANALYSIS CONFIGURATION
# ==================================================================================

# Automatic phenotype detection and regression type selection
_analysis_settings:
  automatic_phenotype_detection: true                                               # Automatically detect phenotype type
  regression_type_selection: "automatic"                                            # "automatic", "linear", or "logistic"
  hla_optimized: true                                                               # Optimize for HLA region analysis

# Quality control parameters
_quality_control:
  min_maf: 0.01                                                                     # Minimum minor allele frequency
  min_call_rate: 0.95                                                               # Minimum call rate
  max_missing_rate: 0.05                                                            # Maximum missing rate

# ==================================================================================
# RESOURCE MANAGEMENT
# ==================================================================================

# Memory and performance settings
_performance:
  measure_time: true                                                                # Measure execution time
  show_progress: true                                                               # Show progress indicators
  parallel_jobs: 1                                                                  # Number of parallel jobs

# Temporary file management
_temp_files:
  keep_intermediate: false                                                          # Keep intermediate files
  cleanup_on_exit: true                                                             # Clean up temporary files on exit

# ==================================================================================
# LOGGING CONFIGURATION
# ==================================================================================

# Output verbosity
_verbose: true                                                                      # Enable verbose output
_log_level: "INFO"                                                                  # Log level: DEBUG, INFO, WARNING, ERROR

# ==================================================================================
# VALIDATION SETTINGS
# ==================================================================================

# Input validation
_validation:
  check_input_files: true                                                           # Validate input files exist
  validate_phenotype_distribution: true                                             # Validate phenotype data
  check_plink_availability: true                                                    # Check if PLINK is available

# ==================================================================================
# USAGE MODES
# ==================================================================================

# Command line interface
_cli_mode: true                                                                     # Enable command line interface
_interactive: false                                                                 # Enable interactive mode

# Python API mode
_api_mode: true                                                                     # Enable Python API mode
_return_results: true                                                               # Return results as Python objects

# ==================================================================================
# OUTPUT FILE NAMING CONVENTION
# ==================================================================================
# The output files will be named using the following pattern:
# {phenotype_basename}_REG_{bfile_basename}.{extension}
#
# Example with current settings:
# Input: bfile_prefix = "bMGen_wtccc_filtered_58C_RA.hatk.300+300.imgt3320.2field.hg18"
#        pheno_file = "wtccc_filtered_58C_RA.hatk.300+300.phe"
# Output files:
# - Association results: "wtccc_filtered_58C_RA.hatk.300+300_REG_bMGen_wtccc_filtered_58C_RA.hatk.300+300.imgt3320.2field.hg18.assoc.logistic"
# - Summary file: "wtccc_filtered_58C_RA.hatk.300+300_REG_bMGen_wtccc_filtered_58C_RA.hatk.300+300.imgt3320.2field.hg18_summary.txt"
# - Log file: "wtccc_filtered_58C_RA.hatk.300+300_REG_bMGen_wtccc_filtered_58C_RA.hatk.300+300.imgt3320.2field.hg18.log"
#
# This naming convention provides:
# - Clear identification of input files used
# - Distinction between different analysis runs
# - Easy tracking of analysis parameters
# - Consistent file organization
# - Unique file names for each analysis run 