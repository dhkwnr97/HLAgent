# Configuration for OptiType to HPED conversion.

# --- Input File(s) Configuration ---
# You can specify input files in two ways:
# 1. Directly list the input .tsv files using '_input_files'.
#    Example: _input_files: ["data/input/OtherHLAimpute/OptiType/<impute job time>/<impute job time>_result.tsv", ...]
# 2. Specify a directory path using '_input_dir_path'. All .tsv files in this directory will be used as input.
#    Example: _input_dir_path: "data/input/OtherHLAimpute/OptiType"
# If both '_input_files' and '_input_dir_path' are provided, '_input_files' will take precedence.
# At least one of them must be specified.

_input_files: null #[data/input/OtherHLAimpute/Optitype/2025_06_26_10_10_36/2025_06_26_10_10_36_result.tsv]
_input_dir_path: data/input/OtherHLAimpute/Optitype

# --- Output Path Configuration ---
# The directory where the output .hped file will be saved.
# The output file name will be automatically generated based on the common prefix of input files.
_output_path: data/output/ConvertHPED