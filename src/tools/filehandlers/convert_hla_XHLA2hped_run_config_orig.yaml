# Configuration for xHLA to HPED conversion.

# --- Input File(s) Configuration ---
# You can specify input files in two ways:
# 1. Directly list the input JSON files using '_input_files'.
#    Example: _input_files: ["data/input/OtherHLAimpute/xHLA/test.json", "data/input/OtherHLAimpute/xHLA/test2.json"]
# 2. Specify a directory path using '_input_dir_path'. All .json files in this directory will be used as input.
#    Example: _input_dir_path: "data/input/OtherHLAimpute/xHLA"
# If both '_input_files' and '_input_dir_path' are provided, '_input_files' will take precedence.
# At least one of them must be specified.

_input_files: null #[data/input/OtherHLAimpute/xHLA/test.json, data/input/OtherHLAimpute/xHLA/test2.json, data/input/OtherHLAimpute/xHLA/test3.json]
_input_dir_path: data/input/OtherHLAimpute/xHLA

# --- Output Path Configuration ---
# The directory where the output .hped file will be saved.
# The output file name will be automatically generated based on the common prefix of input files.
_output_path: data/output/ConvertHPED