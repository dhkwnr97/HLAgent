# Configuration for running HLAHD imputation.

# Docker image to use for HLAHD.
docker_image: "varunkesherwani/hla-hd:latest"

# Define all necessary volume mounts for the Docker container.
# The runner will automatically translate paths in 'hlahd_params' based on these mounts.
volume_mounts:
  - host_path: "data/input/Fastq"
    container_path: "/app"
    description: "Path to directory containing FASTQ files."
  - host_path: "data/output/HLAImputation/HLAHD"
    container_path: "/data/Output_dir"
    description: "Directory for all output files."

# Parameters for the ./bin/hlahd.sh script.
# --- IMPORTANT ---
# All paths below should be specified from the HOST machine's perspective.
# The runner will automatically convert them to container paths.
hlahd_params:
  # Host path to the input fastq files.
  input_r1_fastq: "data/input/Fastq/NA11995_SRR766010_1_fished.fastq"
  input_r2_fastq: "data/input/Fastq/NA11995_SRR766010_2_fished.fastq"

  # HLA-HD specific parameters (based on hlahd.sh options)
  threads: 10                    # -t: number of threads
  rate_of_cutting: null         # -c: rate of cutting (optional)
  minimum_tag_size: 100         # -m: minimum tag size
  number_of_mismatch: null      # -n: number of mismatch (optional)
  freq_dir: "freq_data/"        # -f: frequency directory
  ambiguous_char_size: null     # -N: size of ambiguous character (optional)
  
  # Sample ID (arbitrary name for the analysis) # This is the name of the output directory in host_path.
  sample_id: "sampleID"