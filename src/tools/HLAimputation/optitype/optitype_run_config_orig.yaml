# Configuration for running OptiType imputation.

# Docker image to use for OptiType.
docker_image: "fred2/optitype"

# Define all necessary volume mounts for the Docker container.
# The runner will automatically translate paths in 'optitype_params' based on these mounts.
volume_mounts:
  - host_path: "data/input/Fastq/"
    container_path: "/data"
    description: "Main input data directory (e.g., FASTQ files)."
  - host_path: "data/output/HLAImputation/Optitype"
    container_path: "/output"
    description: "Directory for all output files."

# Parameters for the OptiType script.
# --- IMPORTANT ---
# All paths below should be specified from the HOST machine's perspective.
# The runner will automatically convert them to container paths.
optitype_params:
  # Host path to the input file(s). Can be one file (single-end) or two files (paired-end).
  input_files:
    - "data/input/Fastq/NA11995_SRR766010_1_fished.fastq"
    - "data/input/Fastq/NA11995_SRR766010_1_fished.fastq"
  
  # Sequencing data type (required: either 'rna' or 'dna')
  data_type: "dna"  # Options: "rna" or "dna"
  
  # Host path for the output directory
  output_dir: "data/output/HLAImputation/Optitype"
  
  # Optional parameters
  beta: null              # Beta value for homozygosity detection (default: 0.009)
  enumerate: 1            # Number of enumerations (default: 1)
  verbose: true           # Enable verbose mode
  
  # OptiType configuration settings (config.ini content)
  config:
    mapping:
      razers3: "/usr/local/bin/razers3"
      threads: 5
    ilp:
      solver: "cbc"
      threads: 5
    behavior:
      deletebam: true
      unpaired_weight: 0
      use_discordant: false 